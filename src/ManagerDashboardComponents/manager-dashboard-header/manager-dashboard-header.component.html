<div class="header">
  <div class="row">
    <div class="welcome-badge col-md-3 ms-2 my-auto">
        <span class="pulse-dot"></span>
        <span>Welcome, <strong>{{ username || 'User' }}</strong></span>
    </div>

    <!-- Right Side: Content Box -->
    <div class="col-auto p-3 rounded ms-auto">
        <div class="d-flex justify-content-between align-items-center w-100">
            <div>
                <button class="btn btn-primary p-2 me-4" (click)="addMoney()">
                    <i class="bi bi-plus-circle text-white"></i>  Add Money
                </button>
            </div>
            <!-- Purse Badge: Internal Content Row-by-Row (Side-by-Side Flex) -->
            <div class="bg-primary rounded-pill px-4 py-2 ms-4 me-4 d-flex flex-column align-items-center gap-1">
                <span class="text-white">Current Purse</span>
                <strong class="text-warning fs-4">{{currentPurse | currency:'INR'}}</strong>
            </div>
            
            <!-- Notification Bell: Pushed to the far right -->
            <i class="bi bi-bell fs-4 ms-4 me-2 fw-bold"></i>  

        </div>
    </div>
  </div>
  <div class="row">
    <ul class="list-inline">
        <li class="list-inline-item list-item-hover bg-primary p-2 rounded-pill me-2 ms-4 text-white font-weight-500" (click)="setSelectedOption('purchaseOldMetal',1)" [class.active]="activeItemIndex === 1"><i class="bi bi-cart-plus"></i> Purchase Old Metal </li>
        <li class="list-inline-item list-item-hover bg-primary p-2 rounded-pill me-2 ms-4 text-white font-weight-500" (click)="setSelectedOption('sellPureMetal',2)" [class.active]="activeItemIndex === 2"><i class="bi bi-tag"></i> Sell Pure Metal </li>
        <li class="list-inline-item list-item-hover bg-primary p-2 rounded-pill me-2 ms-4 text-white font-weight-500" (click)="setSelectedOption('normalCredit',3)" [class.active]="activeItemIndex === 3"><i class="bi bi-bank"></i> Normal Credit </li>
    </ul>
  </div>
</div>
<app-add-money
    [show]="showModal"
    (close)="showModal = false">
</app-add-money>
