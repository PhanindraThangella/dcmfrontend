<div class="card shadow-lg p-4" style="width:600px;">
    <h3 class="text-center mb-4">Purchase Old Metal</h3>

    <div class="d-flex justify-content-center gap-3 mb-4">

        <button
            class="btn "
            [ngClass]="selectedMetal==='GOLD' ? 'btn-warning':'btn-outline-warning'"
            (click)="selectedMetal='GOLD'">
            GOLD
        </button>
         <button
            class="btn "
            [ngClass]="selectedMetal==='SILVER' ? 'btn-secondary':'btn-outline-secondary'"
            (click)="selectedMetal='SILVER'">
            SILVER
        </button>
    </div>

    <div class="row mb-3 align-items-center">

        <label class="col-sm-3 col-form-label">
            Weight
        </label>

        <div class="col-sm-9">
            <input
                type="number"
                class="form-control"
                [(ngModel)]="weight">
        </div>

    </div>

    <div class="row mb-4 align-items-center">

        <label class="col-sm-3 col-form-label">
            Amount
        </label>

        <div class="col-sm-9">
            <input
                type="text"
                class="form-control"
                [(ngModel)]="amount"
                appCommaNumber>
        </div>

    </div>

    <div class="d-flex justify-content-center gap-3">

        <button class="btn btn-outline-secondary px-4" (click)="clearContent()">
            Cancel
        </button>

        <button class="btn btn-success px-4" (click)="save()">
            Save
        </button>

    </div>

</div>
<app-modal [isVisible]="isModalOpen" 
  [message]="validMessage"
  [icon]="iconValue"
  [textColor]="textColor"
  (close)="isModalOpen = false"></app-modal>
