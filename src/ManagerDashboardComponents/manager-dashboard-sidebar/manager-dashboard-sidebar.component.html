<div class="sidebar py-0">

  <div class="logo py-2">
    <img class="logoImg" src="assets/Website-Logo.png"/>
  </div>
  <ul>
    <li (click)="changeDashboard('pendingOrders')" [class.active]="currentDashboard === 'pendingOrders'">
      <i class="bi bi-house-fill me-2" ></i>
      Dashboard
    </li>
  </ul>
  <hr class="my-2">
  <span class="textul">Reports</span>
  <ul>
    <li (click)="changeDashboard('daybook')" [class.active]="currentDashboard === 'daybook'">
      <i class="bi bi-calendar3-week me-2"></i>
      DayBook Reports
    </li>

    <li (click)="changeDashboard('creditReports')" [class.active]="currentDashboard === 'creditReports'">
      <i class="bi bi-calendar3 me-2"></i>
      Credits Reports
    </li>

    <li>
      <i class="bi bi-bar-chart-line-fill me-2"></i>
      Yearly Reports
    </li>
  </ul>
  <hr class="my-2">
  <span class="textul">Sales</span>
  <ul class="border-3">
    <li (click)="changeDashboard('goldSales')" [class.active]="currentDashboard === 'goldSales'">
      <i class="bi bi-grid-fill text-warning me-2"></i>
      Gold Sales
    </li>

    <li (click)="changeDashboard('silverSales')" [class.active]="currentDashboard === 'silverSales'">
      <i class="bi bi-grid-fill me-2"></i>
      Silver Sales
    </li>

    <li>
      <i class="bi bi-handbag me-2"></i>
      Orders
    </li>
  </ul>
  <hr class="my-2">
  <ul class="border-3">
    <span class="textul">Employees</span>
    <li (click)="changeDashboard('employeeSalaries')" [class.active]="currentDashboard === 'employeeSalaries'">
      <i class="bi bi-person-fill me-2"></i>
      Employee Salary
    </li>
  </ul>
  <hr>
  <ul class="border-3">
    <li>
      <i class="bi bi-gear-fill me-2"></i>
      Settings
    </li>
    <li (click)="getLogout()">
      <i class="bi bi-box-arrow-right me-2"></i>
      Logout
    </li>
  </ul>
</div>
