<div
    class="modal fade"
    [class.show]="show"
    [style.display]="show ? 'block' : 'none'">

    <div class="modal-dialog modal-lg modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h4 class="modal-title">
                    Add Money To Purse
                </h4>

                <button
                    class="btn-close"
                    (click)="closeModal()">
                </button>

            </div>

            <div class="modal-body">

                <div class="row g-3 align-items-center mb-4">

                    <div class="col-md-2">
                        <label class="fw-semibold">
                            Amount
                        </label>
                    </div>

                    <div class="col-md-7">

                        <input
                            type="text"
                            class="form-control"
                            [(ngModel)]="amount"
                            appCommaNumber>

                    </div>

                    <div class="col-md-3">

                        <button
                            class="btn btn-primary w-100"
                            (click)="addMoney()"
                            [disabled]="loading">

                            Add

                        </button>

                    </div>

                </div>

                <div class="table-container">

                    <table class="table table-bordered text-center align-middle mb-0">

                        <thead>

                            <tr>

                                <th>Time</th>
                                <th>Amount Added</th>
                                <th>Current Balance</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr *ngIf="loading">

                                <td colspan="3">

                                    Loading...

                                </td>

                            </tr>

                            <tr *ngFor="let item of purseHistory">

                                <td>{{item.time | date: 'hh:mm a'}}</td>

                                <td>{{item.amountAdded | currency:'INR'}}</td>

                                <td>{{item.currentPurse | currency:'INR'}}</td>

                            </tr>

                            <tr *ngIf="!loading && purseHistory.length==0">

                                <td colspan="3">

                                    No Records Found

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

<div
    *ngIf="show"
    class="modal-backdrop fade show">
</div>
