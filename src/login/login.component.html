<div class="container-fluid login-wrapper">
  <div class="row justify-content-center align-items-center min-vh-100">
    <!-- <div class="col-11 col-sm-8 col-md-6 col-lg-4 col-xl-3"> -->
    <div class="col-11 col-sm-8 col-md-6 col-lg-5 col-xl-4">


      <div class="card shadow-lg border-0 rounded-4">
        <div class="card-body p-4 p-md-5">

          <div class="text-center mb-4">
            <h2 class="fw-bold">Welcome Back</h2>
            <p class="text-muted mb-0">
              Sign in to your account
            </p>
            <p class="text-danger" *ngIf="errorMessage">{{errorMessage}}</p>
          </div>

          <form [formGroup]="loginForm" (ngSubmit)="login()">

            <!-- Email -->
            <div class="mb-3">
              <label class="form-label fw-semibold" for="username">
                Username:
              </label>
              <input
                type="text"
                class="form-control form-control-lg"
                formControlName="username"
                id="username"
                placeholder="Enter your email/ PhoneNumber" maxlength="10">

              <span class="text-danger small"
                *ngIf="loginForm.get('username')?.invalid &&
                       loginForm.get('username')?.dirty">
                Please enter a valid email/PhoneNumber.
              </span>
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label class="form-label fw-semibold" for="password">
                Password
              </label>
              <input
                type="password"
                class="form-control form-control-lg"
                formControlName="password"
                id="password"
                placeholder="Enter your password">

              <span class="text-danger small"
                *ngIf="loginForm.get('password')?.hasError('pattern') &&
                loginForm.get('password')?.touched">
                Password is required.
              </span>
            </div>

            <!-- Remember Me -->
            <div class="d-flex justify-content-between align-items-center mb-4">
              <div class="form-check">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="rememberMe">

                <label
                  class="form-check-label"
                  for="rememberMe">
                  Remember Me
                </label>
              </div>

              <a href="#" class="text-decoration-none" onclick="alert('Contact Admin for change')">
                Forgot Password?
              </a>
            </div>

            <!-- Button -->
            <button
              type="submit"
              class="btn btn-primary btn-lg w-100 rounded-3"
              [disabled]="loginForm.invalid">
              Login
            </button>

            <!-- Signup -->
            <div class="text-center mt-4">
              <span class="text-muted">
                Don't have an account?Contact Admin
              </span>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
