<div class="card stats-card mb-2 py-2 px-4">

  <div class="row">
    <div class="icon col-lg-4 ">
        <i [class]="icon"></i>
    </div>
    <div class="col-lg-6">
        <h6>{{title}}</h6>
        <h3>{{value}}</h3>
    </div>
    <div class="col-lg-2">
      <span>{{percent}}</span>
    </div>
  </div>

</div>
