<div class="container mt-5">

    <div class="card shadow-lg border-0">

        <div class="card-body p-4">

            <h3 class="text-center mb-4">
                Generate Tag
            </h3>

            <form [formGroup]="tagForm"
                  (ngSubmit)="generate()">

                <div class="row g-3">

                    <!-- Lot No -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Lot No
                        </label>

                        <input
                            class="form-control"
                            formControlName="lotNo">

                        <small class="text-danger"
                            *ngIf="f['lotNo'].touched && f['lotNo'].invalid">

                            Lot Number is required

                        </small>

                    </div>

                    <!-- Metal -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Metal Type
                        </label>

                        <select
                            class="form-select"
                            formControlName="metalType">

                            <option value="">Select</option>

                            <option
                                *ngFor="let item of metalTypes"
                                [value]="item">

                                {{item}}

                            </option>

                        </select>

                        <small class="text-danger"
                            *ngIf="f['metalType'].touched && f['metalType'].invalid">

                            Metal Type is required

                        </small>

                    </div>

                    <!-- Product -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Product Name
                        </label>

                        <input
                            class="form-control"
                            formControlName="productName">

                        <small class="text-danger"
                            *ngIf="f['productName'].touched && f['productName'].invalid">

                            Product Name is required

                        </small>

                    </div>

                    <!-- Price -->

                    <div class="col-md-6">

                        <label class="form-label">
                            Peices
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            formControlName="peices">

                        <small class="text-danger"
                            *ngIf="f['peices'].touched && f['peices'].invalid">

                            Peices is required

                        </small>

                    </div>

                    <!-- Gross -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Gross Weight
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            formControlName="grossWeight">

                    </div>

                    <!-- Less -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Less
                        </label>

                        <input
                            type="number"
                            class="form-control"
                            formControlName="lessWeight">

                    </div>

                    <!-- Net -->

                    <div class="col-md-4">

                        <label class="form-label">
                            Net Weight
                        </label>

                        <input
                            class="form-control"
                            formControlName="netWeight"
                            readonly>

                    </div>

                    <!-- Stone Present -->

                    <div class="col-12">

                        <div class="form-check mt-2">

                            <input
                                class="form-check-input"
                                type="checkbox"
                                formControlName="stonePresent"
                                id="stone">

                            <label
                                class="form-check-label"
                                for="stone">

                                Stones Present

                            </label>

                        </div>

                    </div>

                    <!-- Conditional -->

                    <ng-container *ngIf="f['stonePresent'].value">

                        <div class="col-md-6">

                            <label class="form-label">

                                Stones Weight

                            </label>

                            <input
                                class="form-control"
                                formControlName="stoneWeight">

                            <small
                                class="text-danger"
                                *ngIf="f['stoneWeight'].touched && f['stoneWeight'].invalid">

                                Stone Weight is required

                            </small>

                        </div>

                        <div class="col-md-6">

                            <label class="form-label">

                                Stones Amount

                            </label>

                            <input
                                class="form-control"
                                formControlName="stoneAmount">

                            <small
                                class="text-danger"
                                *ngIf="f['stoneAmount'].touched && f['stoneAmount'].invalid">

                                Stone Amount is required

                            </small>

                        </div>

                    </ng-container>

                </div>

                <div class="text-center mt-4">

                    <button
                        class="btn btn-primary px-5"
                        type="submit"
                        [disabled]="tagForm.invalid">

                        Generate

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>
<app-modal [isVisible]="isModalOpen" 
  [message]="validMessage"
  [icon]="iconValue"
  [textColor]="textColor"
  (close)="isModalOpen = false"></app-modal>
