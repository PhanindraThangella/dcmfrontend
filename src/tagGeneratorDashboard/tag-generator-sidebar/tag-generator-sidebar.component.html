<div class="sidebar py-0">

  <div class="logo py-2 mb-4">
    <img class="logoImg" src="assets/Website-Logo.png"/>
  </div>
  <ul >
    <li (click)="changeDashboard('generateTag')" [class.active]="currentDashboard === 'generateTag'">
      <i class="bi bi-tag me-2"></i>
      Generate Tag
    </li>
  </ul>
  <ul>
    <li (click)="changeDashboard('modifyTagDetails')" [class.active]="currentDashboard === 'modifyTagDetails'">
      <i class="bi bi-pencil-square me-2"></i>
      Modify Tag Details
    </li>

    <li (click)="changeDashboard('verifyItems')" [class.active]="currentDashboard === 'verifyItems'">
      <i class="bi bi-clipboard-check me-2"></i>
        Verify Items
    </li>
  </ul>
  <ul class="border-3">
    <li (click)="changeDashboard('deleteItems')" [class.active]="currentDashboard === 'deleteItems'">
      <i class="bi bi-trash3 me-2"></i>
      Delete Items
    </li>
    <li (click)="changeDashboard('viewRecents')" [class.active]="currentDashboard === 'viewRecents'">
      <i class="bi bi-clock-history me-2"></i>
      View Recents
    </li>
  </ul>
  
  <ul class="border-3 position-fixed bottom-0">
    <li>
      <i class="bi bi-gear-fill me-2"></i>
      Settings
    </li>
    <li (click)="getLogout()">
      <i class="bi bi-box-arrow-right me-2"></i>
      Logout
    </li>
  </ul>
</div>
